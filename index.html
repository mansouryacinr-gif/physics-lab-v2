<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المختبر الافتراضي - 4AM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
    canvas { background-color: #020617; border: 1px solid #334155; border-radius: 12px; touch-action: none; }
  </style>
</head>
<body class="p-4 max-w-6xl mx-auto space-y-4">

  <!-- Header -->
  <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-2">
    <div>
      <h1 class="text-xl font-bold text-blue-400">⚛️ المختبر الافتراضي للفيزياء</h1>
      <p class="text-xs text-slate-400">الظواهر الكهربائية (4AM)</p>
    </div>
    <div class="text-xs text-slate-300 bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600">
      إعداد: <span class="text-emerald-400 font-bold">منصور محمد ياسين</span> | أستاذ المادة: <span class="text-blue-300 font-bold">جرادي أحمد</span>
    </div>
  </div>

  <!-- Navigation Buttons -->
  <div class="flex gap-2 overflow-x-auto pb-2">
    <button id="btn-sec1" onclick="showSection(1)" class="px-4 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white">⚛️ النموذج الكوكبي للذرة</button>
    <button id="btn-sec2" onclick="showSection(2)" class="px-4 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700">🧲 التجاذب والتنافر بين القضبان</button>
    <button id="btn-sec3" onclick="showSection(3)" class="px-4 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700">⚡ طرق التكهرب والكشاف</button>
  </div>

  <!-- SECTION 1: ATOM MODEL -->
  <div id="section1" class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <h2 class="font-bold text-blue-400 border-b border-slate-700 pb-2">🪐 التوزيع الإلكتروني للذرات</h2>
      <label class="block text-xs text-slate-300 font-semibold">اختر الذرة للرسم والتوزيع:</label>
      <select id="atom-choice" onchange="drawSelectedAtom()" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg font-bold text-sm text-slate-200">
        <option value="H">1. الهيدروجين (H) - Z=1</option>
        <option value="C">2. الكربون (C) - Z=6</option>
        <option value="O" selected>3. الأكسجين (O) - Z=8</option>
        <option value="Na">4. الصوديوم (Na) - Z=11</option>
        <option value="Cl">5. الكلور (Cl) - Z=17</option>
      </select>
      <div id="atom-info" class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs space-y-1.5 text-slate-300"></div>
    </div>
    <div class="md:col-span-2 bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-center">
      <canvas id="cvs-atom" width="600" height="350" class="w-full h-[350px]"></canvas>
    </div>
  </div>

  <!-- SECTION 2: ATTRACTION & REPUISION -->
  <div id="section2" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <h2 class="font-bold text-blue-400 border-b border-slate-700 pb-2">🧲 التجاذب والتنافر بين الشحنات</h2>
      
      <div>
        <label class="block text-xs text-slate-300 font-semibold mb-1">1. القضيب الممسوك باليد (المتحرك):</label>
        <select id="rod-hand" onchange="renderAtt()" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs font-bold text-slate-200">
          <option value="ebonite">إيبونيت مشحون (-)</option>
          <option value="glass">زجاج مشحون (+)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-slate-300 font-semibold mb-1">2. القضيب المعلّق (المستجيب):</label>
        <select id="rod-hung" onchange="renderAtt()" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs font-bold text-slate-200">
          <option value="ebonite">إيبونيت مشحون (-)</option>
          <option value="glass">زجاج مشحون (+)</option>
        </select>
      </div>

      <div id="att-result-box" class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs space-y-1 text-amber-400 font-bold">
        <!-- Result text updated dynamically -->
      </div>

      <button onclick="resetAttraction()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold">🔄 إعادة الوضع الابتدائي</button>
    </div>
    <div class="md:col-span-2 bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-center">
      <canvas id="cvs-att" width="600" height="350" class="w-full h-[350px] cursor-grab"></canvas>
    </div>
  </div>

  <!-- SECTION 3: ELECTRIFICATION & ELECTROSCOPE -->
  <div id="section3" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <h2 class="font-bold text-blue-400 border-b border-slate-700 pb-2">⚡ الطرق والكشاف الكهربائي</h2>
      <label class="block text-xs text-slate-300 font-semibold">اختر القضيب:</label>
      <div class="grid grid-cols-2 gap-2">
        <button id="rod-elec-ebonite" onclick="setElecRod('ebonite')" class="py-2 bg-blue-600/30 border border-blue-500 text-blue-300 font-bold rounded-lg text-xs">إيبونيت (-)</button>
        <button id="rod-elec-glass" onclick="setElecRod('glass')" class="py-2 bg-slate-900 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs">زجاج (+)</button>
      </div>
      <label class="block text-xs text-slate-300 font-semibold">طريقة التكهرب:</label>
      <select id="elec-method" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg font-bold text-xs text-slate-200">
        <option value="contact">1. التكهرب باللمس</option>
        <option value="induction">2. التكهرب بالتأثير</option>
      </select>
      <p class="text-xs text-amber-400 bg-slate-900 p-3 rounded-lg border border-slate-700">
        👈 **اسحب القضيب وقربه من قرص الكشاف** لملاحظة انفراج الورقتين.
      </p>
      <button onclick="resetElectro()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold">🔄 تفريغ الشحنة</button>
    </div>
    <div class="md:col-span-2 bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-center">
      <canvas id="cvs-elec" width="600" height="350" class="w-full h-[350px] cursor-grab"></canvas>
    </div>
  </div>

  <script>
    function showSection(num) {
      for(let i=1; i<=3; i++) {
        document.getElementById(`section${i}`).classList.add('hidden');
        document.getElementById(`btn-sec${i}`).className = 'px-4 py-2.5 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700';
      }
      document.getElementById(`section${num}`).classList.remove('hidden');
      document.getElementById(`btn-sec${num}`).className = 'px-4 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white';

      if(num === 1) drawSelectedAtom();
      if(num === 2) renderAtt();
      if(num === 3) renderElectro();
    }

    // --- Section 1: Atom ---
    const atomsData = {
      'H':  { name: 'ذرة الهيدروجين (H)', z: 1,  shells: [1],       config: 'K¹' },
      'C':  { name: 'ذرة الكربون (C)',     z: 6,  shells: [2, 4],    config: 'K² L⁴' },
      'O':  { name: 'ذرة الأكسجين (O)',    z: 8,  shells: [2, 6],    config: 'K² L⁶' },
      'Na': { name: 'ذرة الصوديوم (Na)',   z: 11, shells: [2, 8, 1], config: 'K² L⁸ M¹' },
      'Cl': { name: 'ذرة الكلور (Cl)',     z: 17, shells: [2, 8, 7], config: 'K² L⁸ M⁷' }
    };
    let atomAngle = 0, atomTimer = null;

    function drawSelectedAtom() {
      const key = document.getElementById('atom-choice').value;
      const data = atomsData[key];
      document.getElementById('atom-info').innerHTML = `
        <p class="font-bold text-blue-300 text-sm">${data.name}</p>
        <p>• العدد الذري (Z): <span class="text-amber-400 font-bold">${data.z} بروتونات (+${data.z})</span></p>
        <p>• عدد الإلكترونات: <span class="text-sky-400 font-bold">${data.z} إلكترونات (-${data.z})</span></p>
        <p>• التوزيع المداري: <span class="text-emerald-400 font-bold">${data.config}</span></p>
      `;

      const cvs = document.getElementById('cvs-atom');
      const ctx = cvs.getContext('2d');
      if(atomTimer) cancelAnimationFrame(atomTimer);

      function loop() {
        if(document.getElementById('section1').classList.contains('hidden')) return;
        ctx.clearRect(0,0,cvs.width,cvs.height);
        const cx = cvs.width/2, cy = cvs.height/2;

        ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI*2);
        ctx.fillStyle = '#ef4444'; ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`+${data.z}`, cx, cy+4);

        const radii = [50, 90, 135], labels = ['K', 'L', 'M'];
        data.shells.forEach((count, idx) => {
          const r = radii[idx];
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
          ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
          ctx.fillText(labels[idx], cx + r + 10, cy + 3);

          for(let i=0; i<count; i++) {
            const a = atomAngle + (i * (2 * Math.PI / count));
            const ex = cx + r * Math.cos(a), ey = cy + r * Math.sin(a);
            ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI*2);
            ctx.fillStyle = '#38bdf8'; ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif';
            ctx.fillText('-', ex, ey+3);
          }
        });
        atomAngle += 0.015;
        atomTimer = requestAnimationFrame(loop);
      }
      loop();
    }

    // --- Section 2: Attraction & Repulsion ---
    let attX = 50, attY = 150, rodAngle = 0;

    function resetAttraction() { attX = 50; attY = 150; rodAngle = 0; renderAtt(); }

    function renderAtt() {
      const cvs = document.getElementById('cvs-att');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,cvs.width,cvs.height);

      const handType = document.getElementById('rod-hand').value;
      const hungType = document.getElementById('rod-hung').value;
      const resBox = document.getElementById('att-result-box');

      const isSame = (handType === hungType);
      if(isSame) {
        resBox.innerHTML = `⚠️ <span class="text-rose-400">شحنات متماثلة: يحدث تنافر!</span> (تتباعد القضبان عند التقريب)`;
      } else {
        resBox.innerHTML = `✨ <span class="text-emerald-400">شحنات مختلفة: يحدث تجاذب!</span> (تتجاذب القضبان عند التقريب)`;
      }

      const px = 400, py = 40;
      const rx = attX + 110, ry = attY + 12;
      const hungCenterY = py + 120;
      const dist = Math.hypot(rx - px, ry - hungCenterY);

      if(dist < 130) {
        if(isSame) {
          rodAngle = Math.min(rodAngle + 0.02, 0.45); // Repulsion
        } else {
          rodAngle = Math.max(rodAngle - 0.02, -0.35); // Attraction
        }
      }

      // Stand & Thread
      ctx.beginPath(); ctx.moveTo(px-30, py); ctx.lineTo(px+30, py); ctx.lineWidth=4; ctx.strokeStyle='#64748b'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + 40); ctx.lineWidth=2; ctx.strokeStyle='#cbd5e1'; ctx.stroke();

      // Hung Rod (Rotates)
      ctx.save();
      ctx.translate(px, py + 40);
      ctx.rotate(rodAngle);
      ctx.fillStyle = hungType === 'ebonite' ? '#1e293b' : '#0284c7';
      ctx.fillRect(-60, 0, 120, 22);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(-60, 0, 120, 22);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(hungType === 'ebonite' ? 'إيبونيت (-)' : 'زجاج (+)', 0, 15);
      ctx.restore();

      // Hand Rod (Movable)
      ctx.fillStyle = handType === 'ebonite' ? '#1e293b' : '#0284c7';
      ctx.fillRect(attX, attY, 110, 24);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(attX, attY, 110, 24);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(handType === 'ebonite' ? 'إيبونيت (-)' : 'زجاج (+)', attX + 55, attY + 16);
    }

    // --- Section 3: Electroscope ---
    let elecRod = 'ebonite', elecX = 50, elecY = 50, leafAng = 0;

    function setElecRod(t) {
      elecRod = t;
      document.getElementById('rod-elec-ebonite').className = t === 'ebonite' ? 'py-2 bg-blue-600/30 border border-blue-500 text-blue-300 font-bold rounded-lg text-xs' : 'py-2 bg-slate-900 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs';
      document.getElementById('rod-elec-glass').className = t === 'glass' ? 'py-2 bg-blue-600/30 border border-blue-500 text-blue-300 font-bold rounded-lg text-xs' : 'py-2 bg-slate-900 border border-slate-700 text-slate-400 font-bold rounded-lg text-xs';
      renderElectro();
    }

    function resetElectro() { elecX = 50; elecY = 50; leafAng = 0; renderElectro(); }

    function renderElectro() {
      const cvs = document.getElementById('cvs-elec');
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0,0,cvs.width,cvs.height);

      const cx = 380, cy = 90;
      const method = document.getElementById('elec-method').value;
      const dist = Math.hypot((elecX + 100) - cx, (elecY + 10) - cy);

      if(method === 'contact' && dist < 50) leafAng = Math.min(leafAng + 0.08, 0.55);
      else if(method === 'induction' && dist < 100) leafAng = Math.min(leafAng + 0.04, 0.4);

      ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI*2); ctx.fillStyle='#94a3b8'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + 120); ctx.lineWidth = 5; ctx.strokeStyle='#64748b'; ctx.stroke();

      ctx.save(); ctx.translate(cx, cy + 120);
      ctx.rotate(-leafAng); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-10, 42); ctx.lineWidth=4; ctx.strokeStyle='#f59e0b'; ctx.stroke();
      ctx.rotate(leafAng * 2); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10, 42); ctx.lineWidth=4; ctx.strokeStyle='#f59e0b'; ctx.stroke();
      ctx.restore();

      ctx.fillStyle = elecRod === 'ebonite' ? '#1e293b' : '#0284c7';
      ctx.fillRect(elecX, elecY, 110, 24);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(elecRod === 'ebonite' ? 'إيبونيت (-)' : 'زجاج (+)', elecX + 55, elecY + 16);
    }

    // Drag Helper
    function setupDrag(canvasId, setCoord, renderFn) {
      const cvs = document.getElementById(canvasId);
      let dragging = false;
      const updatePos = (e) => {
        const r = cvs.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setCoord(clientX - r.left - 50, clientY - r.top - 10);
        renderFn();
      };
      cvs.onmousedown = cvs.ontouchstart = (e) => { dragging = true; updatePos(e); };
      window.onmousemove = window.ontouchmove = (e) => { if(dragging) updatePos(e); };
      window.onmouseup = window.ontouchend = () => dragging = false;
    }

    window.onload = () => {
      showSection(1);
      setupDrag('cvs-att', (x, y) => { attX = x; attY = y; }, renderAtt);
      setupDrag('cvs-elec', (x, y) => { elecX = x; elecY = y; }, renderElectro);
    };
  </script>
</body>
</html>
